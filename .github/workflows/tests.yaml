name: tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: true
        type: string

concurrency:
  group: tests-ci-run-${{ inputs.run_number }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/test/process-replay-ref-publication' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: 1
  PYTHONPATH: ${{ github.workspace }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: lfs.fetchexclude
  GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_tinygrad.pkl

jobs:
  process_replay:
    name: process replay
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Build openpilot
      run: scons
    - name: Run replay
      id: replay
      timeout-minutes: ${{ contains(runner.name, 'nsc') && 2 || 20 }}
      continue-on-error: ${{ github.ref == 'refs/heads/test/process-replay-ref-publication' }}
      run: openpilot/selfdrive/test/process_replay/test_processes.py -j$(nproc)
    - name: Print diff
      id: print-diff
      if: always()
      run: cat openpilot/selfdrive/test/process_replay/diff.txt
    - name: Print diff report
      if: always()
      run: cat openpilot/selfdrive/test/process_replay/diff_report.txt
    - uses: actions/upload-artifact@v7
      if: always()
      continue-on-error: true
      with:
        name: process_replay_diff.txt
        path: openpilot/selfdrive/test/process_replay/diff.txt
    - name: Upload diff report
      uses: actions/upload-artifact@v7
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      with:
        name: diff_report_${{ github.event.number }}
        path: openpilot/selfdrive/test/process_replay/diff_report.txt
    - name: Checkout ci-artifacts
      if: github.repository == 'elkoled/openpilot' && github.ref == 'refs/heads/test/process-replay-ref-publication'
      uses: actions/checkout@v7
      with:
        repository: elkoled/ci-artifacts
        ssh-key: ${{ secrets.PROCESS_REPLAY_TEST_DEPLOY_KEY }}
        path: ${{ github.workspace }}/ci-artifacts
    - name: Prepare refs
      if: github.repository == 'elkoled/openpilot' && github.ref == 'refs/heads/test/process-replay-ref-publication'
      working-directory: ${{ github.workspace }}/ci-artifacts
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
        git fetch origin process-replay || true
        git checkout process-replay 2>/dev/null || git checkout --orphan process-replay
        cp ${{ github.workspace }}/openpilot/selfdrive/test/process_replay/fakedata/*.zst .
        echo "${{ github.sha }}" > ref_commit
        git add .
        git commit -m "process-replay refs for ${{ github.repository }}@${{ github.sha }}" || echo "No changes to commit"
    - name: Push refs
      if: github.repository == 'elkoled/openpilot' && github.ref == 'refs/heads/test/process-replay-ref-publication'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: cd ${{ github.workspace }}/ci-artifacts && git push origin process-replay --force

    - name: Verify clean runner can use published refs
      run: |
        test '${{ steps.replay.outcome }}' = success
        test "$(cat ci-artifacts/ref_commit)" = '${{ github.sha }}'
    - name: Wait for raw GitHub ref pointer to update
      timeout-minutes: 7
      run: |
        for attempt in $(seq 1 36); do
          published=$(python -c 'from openpilot.selfdrive.test.process_replay.test_processes import BASE_URL, URLFile; print(URLFile(BASE_URL + "ref_commit", cache=False).read().decode().strip())')
          echo "Raw GitHub ref_commit: $published"
          if [ "$published" = '${{ github.sha }}' ]; then
            exit 0
          fi
          sleep 10
        done
        exit 1
    - name: Replay against published refs without local replay outputs
      timeout-minutes: 20
      run: |
        mv openpilot/selfdrive/test/process_replay/fakedata /tmp/first-replay
        openpilot/selfdrive/test/process_replay/test_processes.py -j$(nproc)
        grep -F 'tested against commit ${{ github.sha }}' openpilot/selfdrive/test/process_replay/diff.txt
    - name: Upload verification reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: published-ref-verification
        path: |
          openpilot/selfdrive/test/process_replay/diff.txt
          openpilot/selfdrive/test/process_replay/diff_report.txt
